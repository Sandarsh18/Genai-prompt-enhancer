# Docker network nginx config - uses Docker service names
# This configuration is PORTABLE and works on any Docker host
# No dependency on host.docker.internal or localhost

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/json;
  sendfile on;
  keepalive_timeout 65;
  
  log_format json_combined '{"time":"$time_iso8601","remote_addr":"$remote_addr","request":"$request","status":$status,"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,"upstream_response_time":"$upstream_response_time"}';
  access_log /var/log/nginx/access.log json_combined;

  # DEVOPS BEST PRACTICE: Docker service discovery
  # Services are referenced by container name within the Docker network
  # This is the SAME approach used in Kubernetes (service DNS)
  
  upstream rewrite_service {
    # Use Docker service name instead of localhost or host.docker.internal
    server rewrite-service:8000 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream summarize_service {
    server summarize-service:8001 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  upstream email_service {
    server email-service:8002 max_fails=3 fail_timeout=10s;
    keepalive 32;
  }

  server {
    listen 8080;
    server_name _;

    # Global CORS configuration
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    # Health check endpoint for NGINX itself
    location /health {
      access_log off;
      return 200 "Gateway healthy\n";
      add_header Content-Type text/plain;
    }

    location /rewrite {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        add_header 'Access-Control-Max-Age' 3600 always;
        return 204;
      }
      
      proxy_pass http://rewrite_service/rewrite;
      
      # Production-grade proxy settings
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_http_version 1.1;
      
      # Retry logic - prevents 502 on temporary backend issues
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 3s;
      
      # Timeouts - fail fast, don't hang
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 30s;
    }

    location /summarize {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        add_header 'Access-Control-Max-Age' 3600 always;
        return 204;
      }
      
      proxy_pass http://summarize_service/summarize;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_http_version 1.1;
      
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 3s;
      
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 30s;
    }

    location /email {
      if ($request_method = 'OPTIONS') {
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        add_header 'Access-Control-Max-Age' 3600 always;
        return 204;
      }
      
      proxy_pass http://email_service/email;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Connection "";
      proxy_http_version 1.1;
      
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
      proxy_next_upstream_timeout 3s;
      
      proxy_connect_timeout 5s;
      proxy_send_timeout 10s;
      proxy_read_timeout 30s;
    }
  }
}
