name: Build and Push Images

on:
  push:
    branches: [ main ]

env:
  REGISTRY: docker.io
  IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/genai

jobs:
  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: frontend
            context: frontend
          - name: rewrite
            context: rewrite-service
          - name: summarize
            context: summarize-service
          - name: email
            context: email-service
          - name: gateway
            context: nginx-gateway
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:${{ github.sha }}
          cache-from: type=registry,ref=${{ env.IMAGE_PREFIX }}-${{ matrix.service.name }}:latest
          cache-to: type=inline
