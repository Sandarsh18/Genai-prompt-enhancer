name: Deploy to Kubernetes

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'k8s/**'
      - 'ci-cd/deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      IMAGE_PREFIX: ${{ secrets.DOCKERHUB_USERNAME }}/genai
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Configure kubeconfig
        run: |
          echo "${KUBE_CONFIG}" | base64 -d > $HOME/.kube/config
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG_BASE64 }}

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s

      - name: Set deployment images
        run: |
          kubectl set image deployment/rewrite-service rewrite=${IMAGE_PREFIX}-rewrite:${GITHUB_SHA} --record
          kubectl set image deployment/summarize-service summarize=${IMAGE_PREFIX}-summarize:${GITHUB_SHA} --record
          kubectl set image deployment/email-service email=${IMAGE_PREFIX}-email:${GITHUB_SHA} --record
          kubectl set image deployment/nginx-gateway nginx=${IMAGE_PREFIX}-gateway:${GITHUB_SHA} --record
          kubectl set image deployment/frontend frontend=${IMAGE_PREFIX}-frontend:${GITHUB_SHA} --record

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/rewrite-service --timeout=120s
          kubectl rollout status deployment/summarize-service --timeout=120s
          kubectl rollout status deployment/email-service --timeout=120s
          kubectl rollout status deployment/nginx-gateway --timeout=120s
          kubectl rollout status deployment/frontend --timeout=120s
