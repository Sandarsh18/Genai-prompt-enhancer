name: Deploy to Kubernetes

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  KUBECTL_VERSION: '1.29.2'
  KIND_CLUSTER_NAME: genai-ci
  NAMESPACE: genai-prompt-enhancer
  IMAGE_REGISTRY: ghcr.io/${{ github.repository }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          wait: 120s

      - name: Build and load images into kind
        env:
          REGISTRY: ${{ env.IMAGE_REGISTRY }}
          TAG: ${{ env.IMAGE_TAG }}
          KIND_CLUSTER_NAME: ${{ env.KIND_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          services=(rewrite-service summarize-service email-service nginx-gateway frontend)
          for svc in "${services[@]}"; do
            build_args=""
            if [ "$svc" = "frontend" ]; then
              build_args="--build-arg VITE_GATEWAY_URL=http://nginx-gateway:8080"
            fi
            docker build $build_args -t ${REGISTRY}/${svc}:${TAG} ${svc}
            kind load docker-image ${REGISTRY}/${svc}:${TAG} --name ${KIND_CLUSTER_NAME}
          done

      - name: Create namespace
        run: |
          kubectl apply -f k8s/namespace.yaml

      - name: Apply configmap
        run: |
          kubectl apply -f k8s/configmap.yaml -n ${{ env.NAMESPACE }}

      - name: Create API secret
        env:
          GENAI_API_KEY: ${{ secrets.GENAI_API_KEY }}
        run: |
          kubectl create secret generic genai-api-credentials \
            --from-literal=GENAI_API_KEY="${GENAI_API_KEY}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply manifests
        run: |
          find k8s -maxdepth 1 -name '*.yaml' ! -name 'namespace.yaml' -print0 | \
            xargs -0 -I{} kubectl apply -f {} -n ${{ env.NAMESPACE }}

      - name: Set deployment images to current commit
        env:
          REGISTRY: ${{ env.IMAGE_REGISTRY }}
          TAG: ${{ env.IMAGE_TAG }}
        run: |
          kubectl set image deployment/rewrite-service rewrite=${REGISTRY}/rewrite-service:${TAG} -n ${{ env.NAMESPACE }} --record
          kubectl set image deployment/summarize-service summarize=${REGISTRY}/summarize-service:${TAG} -n ${{ env.NAMESPACE }} --record
          kubectl set image deployment/email-service email=${REGISTRY}/email-service:${TAG} -n ${{ env.NAMESPACE }} --record
          kubectl set image deployment/nginx-gateway nginx=${REGISTRY}/nginx-gateway:${TAG} -n ${{ env.NAMESPACE }} --record
          kubectl set image deployment/frontend frontend=${REGISTRY}/frontend:${TAG} -n ${{ env.NAMESPACE }} --record

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/rewrite-service -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/summarize-service -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/email-service -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/nginx-gateway -n ${{ env.NAMESPACE }} --timeout=5m
          kubectl rollout status deployment/frontend -n ${{ env.NAMESPACE }} --timeout=5m

      - name: Quick smoke test
        run: |
          kubectl wait --for=condition=available deployment --all -n ${{ env.NAMESPACE }} --timeout=2m
          kubectl port-forward svc/nginx-gateway 8080:8080 -n ${{ env.NAMESPACE }} >/tmp/pf.log 2>&1 &
          PF_PID=$!
          sleep 5
          curl -f http://localhost:8080/health
          kill ${PF_PID}

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "### Pods" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          kubectl get svc -n ${{ env.NAMESPACE }} >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  smoke-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ${{ env.KIND_CLUSTER_NAME }}
          wait: 120s

      - name: Build and load images into kind
        env:
          REGISTRY: ${{ env.IMAGE_REGISTRY }}
          TAG: ${{ env.IMAGE_TAG }}
          KIND_CLUSTER_NAME: ${{ env.KIND_CLUSTER_NAME }}
        run: |
          set -euo pipefail
          services=(rewrite-service summarize-service email-service nginx-gateway frontend)
          for svc in "${services[@]}"; do
            build_args=""
            if [ "$svc" = "frontend" ]; then
              build_args="--build-arg VITE_GATEWAY_URL=http://nginx-gateway:8080"
            fi
            docker build $build_args -t ${REGISTRY}/${svc}:${TAG} ${svc}
            kind load docker-image ${REGISTRY}/${svc}:${TAG} --name ${KIND_CLUSTER_NAME}
          done

      - name: Deploy manifests for smoke test
        env:
          REGISTRY: ${{ env.IMAGE_REGISTRY }}
          TAG: ${{ env.IMAGE_TAG }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml -n ${{ env.NAMESPACE }}
          kubectl create secret generic genai-api-credentials \
            --from-literal=GENAI_API_KEY="${{ secrets.GENAI_API_KEY }}" \
            --namespace=${{ env.NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -
          find k8s -maxdepth 1 -name '*.yaml' ! -name 'namespace.yaml' -print0 | \
            xargs -0 -I{} kubectl apply -f {} -n ${{ env.NAMESPACE }}
          kubectl set image deployment/rewrite-service rewrite=${REGISTRY}/rewrite-service:${TAG} -n ${{ env.NAMESPACE }} --record
          kubectl set image deployment/summarize-service summarize=${REGISTRY}/summarize-service:${TAG} -n ${{ env.NAMESPACE }} --record
          kubectl set image deployment/email-service email=${REGISTRY}/email-service:${TAG} -n ${{ env.NAMESPACE }} --record
          kubectl set image deployment/nginx-gateway nginx=${REGISTRY}/nginx-gateway:${TAG} -n ${{ env.NAMESPACE }} --record
          kubectl set image deployment/frontend frontend=${REGISTRY}/frontend:${TAG} -n ${{ env.NAMESPACE }} --record
          kubectl rollout status deployment --all -n ${{ env.NAMESPACE }} --timeout=5m

      - name: Run smoke tests
        run: |
          kubectl wait --for=condition=available deployment --all -n ${{ env.NAMESPACE }} --timeout=2m
          kubectl port-forward svc/nginx-gateway 8080:8080 -n ${{ env.NAMESPACE }} >/tmp/pf.log 2>&1 &
          PF_PID=$!
          sleep 5
          curl -f http://localhost:8080/health
          kill ${PF_PID}
