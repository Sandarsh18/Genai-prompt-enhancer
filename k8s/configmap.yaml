apiVersion: v1
kind: ConfigMap
metadata:
  name: genai-shared-config
  namespace: genai-prompt-enhancer
  labels:
    app: genai-prompt-enhancer
    tier: platform
  annotations:
    description: "Shared environment configuration for all GenAI services"
data:
  GENAI_PROVIDER: "gemini"
  GENAI_API_BASE_URL: "https://api.openai.com/v1/chat/completions"
  GENAI_GEMINI_BASE_URL: "https://generativelanguage.googleapis.com/v1beta/models"
  GENAI_MODEL: "gemini-1.5-flash"
  GENAI_TIMEOUT: "8"
  LOG_LEVEL: "info"
