apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rewrite-hpa
  labels:
    app: rewrite
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rewrite-service
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
