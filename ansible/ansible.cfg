# ========================================
# Ansible Configuration File
# ========================================
# This file configures Ansible behavior for the GenAI Prompt Enhancer project
# Best practices: Simple, localhost-first, with clear logging

[defaults]
# Inventory file location (defines target hosts)
inventory = ./inventory.ini

# Disable host key checking for localhost/lab environments
# WARNING: Enable this in production for security
host_key_checking = False

# Number of parallel processes (adjust based on your system)
forks = 5

# Timeout for SSH connections (seconds)
timeout = 30

# Display output in a more readable format
stdout_callback = yaml

# Enable color output for better readability
force_color = True

# Retry files location (stores info about failed hosts)
retry_files_enabled = True
retry_files_save_path = ./playbooks/retry

# Roles path (for future extensibility)
roles_path = ./roles

# Log file location (all Ansible operations will be logged here)
log_path = ./ansible.log

# Gather system facts by default (useful for conditional tasks)
gathering = smart

# Fact caching (improves performance for repeated runs)
fact_caching = jsonfile
fact_caching_connection = ./facts_cache
fact_caching_timeout = 3600

[privilege_escalation]
# Enable sudo/root privileges when needed
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH connection optimizations
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
