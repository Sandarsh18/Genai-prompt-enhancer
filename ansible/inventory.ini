# ========================================
# Ansible Inventory File
# ========================================
# Defines all target hosts/servers where Ansible will run tasks
# This setup is for LOCAL DEVELOPMENT/LAB environment

# ==========================================
# LOCAL DEVELOPMENT GROUP
# ==========================================
[local]
# Localhost connection (no SSH needed)
localhost ansible_connection=local

# ==========================================
# KUBERNETES CLUSTER NODES (Future Use)
# ==========================================
# Uncomment and configure when deploying to actual K8s cluster
# [k8s_master]
# k8s-master-01 ansible_host=192.168.1.100 ansible_user=ubuntu

# [k8s_workers]
# k8s-worker-01 ansible_host=192.168.1.101 ansible_user=ubuntu
# k8s-worker-02 ansible_host=192.168.1.102 ansible_user=ubuntu

# ==========================================
# APPLICATION SERVERS (Future Use)
# ==========================================
# [app_servers]
# app-server-01 ansible_host=192.168.1.110 ansible_user=ubuntu

# ==========================================
# MONITORING SERVERS (Future Use)
# ==========================================
# [monitoring]
# prometheus-server ansible_host=192.168.1.120 ansible_user=ubuntu
# grafana-server ansible_host=192.168.1.121 ansible_user=ubuntu

# ==========================================
# GROUP VARIABLES (Apply to all hosts)
# ==========================================
[all:vars]
# Python interpreter (required for Ansible)
ansible_python_interpreter=/usr/bin/python3

# Project configuration
project_name=genai-prompt-enhancer
project_root=/home/1RV24MC093_SANDARSH_J_N/projects/devops-el/genai-prompt-enhancer

# Docker configuration
docker_compose_version=2.24.0
docker_user={{ ansible_user_id }}

# Kubernetes configuration
kubernetes_version=1.28.0
kubectl_version=1.28.0
minikube_version=latest

# Application ports
rewrite_port=8000
summarize_port=8001
email_port=8002
gateway_port=8088
frontend_port=5173
